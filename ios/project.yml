# Gere o projeto do Xcode com:  brew install xcodegen && xcodegen
name: NoticiasReais
options:
  bundleIdPrefix: com.hfneto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: VFK4JUPXJF    # Team ID (developer.apple.com → Membership)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NoticiasReais:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Notícias Reais
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.hfneto.noticiasreais.refresh]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.hfneto.noticiasreais
            CFBundleURLSchemes: [noticiasreais]
    entitlements:
      path: App/NoticiasReais.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hfneto.noticiasreais]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hfneto.noticiasreais
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: NoticiasWidget
  NoticiasWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Notícias Reais
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/NoticiasWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hfneto.noticiasreais]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hfneto.noticiasreais.widget
